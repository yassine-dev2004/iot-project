spring.application.name=smartdoor-backend
server.port=8080

# Database Configuration (PostgreSQL by default, H2 fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartdoor}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartdoor}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smartdoor_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Storage configuration
smartdoor.storage.snapshots-dir=${SNAPSHOTS_DIR:snapshots}
smartdoor.retention.days=${RETENTION_DAYS:30}

# Security
smartdoor.security.jwt.secret=${JWT_SECRET:dGhpc19pc19hX3Zlcnlfc2VjdXJlX2tleV9mb3Jfc21hcnRfZG9vcl9hdXRoXzEyMzQ1Njc4OTA=}
smartdoor.security.jwt.expiration-hours=72

# Gemini for daily summary
smartdoor.gemini.api-key=${GEMINI_API_KEY:}
smartdoor.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
