version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartdoor-postgres
    environment:
      POSTGRES_DB: smartdoor
      POSTGRES_USER: smartdoor
      POSTGRES_PASSWORD: smartdoor_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdoor"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smartdoor-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./iot/mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartdoor-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartdoor
      SPRING_DATASOURCE_USERNAME: smartdoor
      SPRING_DATASOURCE_PASSWORD: smartdoor_secret
      SNAPSHOTS_DIR: /app/snapshots
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - backend_snapshots:/app/snapshots
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  backend_snapshots:
